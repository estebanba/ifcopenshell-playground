[project]
name = "ifcopenshell-playground"
version = "0.1.0"
description = "Playground for exploring IFC (BIM) models with IfcOpenShell, ifccsv and pandas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ifccsv>=0.9.0",
    "ifcopenshell>=0.9.0",
    "numpy>=2.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
]
